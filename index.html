<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Leslie Matrix Simulator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cloudflare.com"></script>
    <!-- Chart.js for the population graph -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🐿️ Interactive Leslie Matrix Simulator</h1>
        <p class="text-gray-600 mb-6">Adjust the initial populations, birth rates, and survival rates using the controls below to see the population path update instantly.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Sidebar Controls -->
            <div class="space-y-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <!-- Initial Population Controls -->
                <div>
                    <h3 class="font-bold text-gray-800 mb-3 border-b border-gray-200 pb-1">Initial Populations</h3>
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-600">Newborns (0-1 yrs): <span id="val-n0" class="font-bold text-emerald-600">100</span></label>
                        <input type="range" id="slider-n0" min="0" max="500" value="100" class="w-full accent-emerald-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Youths (2-3 yrs): <span id="val-n1" class="font-bold text-emerald-600">50</span></label>
                        <input type="range" id="slider-n1" min="0" max="500" value="50" class="w-full accent-emerald-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Adults (4-5 yrs): <span id="val-n2" class="font-bold text-emerald-600">10</span></label>
                        <input type="range" id="slider-n2" min="0" max="500" value="10" class="w-full accent-emerald-600" oninput="runSimulation()">
                    </div>
                </div>

                <!-- Fecundity / Birth Rate Controls -->
                <div>
                    <h3 class="font-bold text-gray-800 mb-3 border-b border-gray-200 pb-1">Fecundity (Birth Rates)</h3>
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-600">Newborn Fecundity: <span id="val-f0" class="font-bold text-blue-600">0.5</span></label>
                        <input type="range" id="slider-f0" min="0" max="5" step="0.1" value="0.5" class="w-full accent-blue-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Youth Fecundity: <span id="val-f1" class="font-bold text-blue-600">3.0</span></label>
                        <input type="range" id="slider-f1" min="0" max="5" step="0.1" value="3.0" class="w-full accent-blue-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Adult Fecundity: <span id="val-f2" class="font-bold text-blue-600">2.0</span></label>
                        <input type="range" id="slider-f2" min="0" max="5" step="0.1" value="2.0" class="w-full accent-blue-600" oninput="runSimulation()">
                    </div>
                </div>

                <!-- Survival Rate Controls -->
                <div>
                    <h3 class="font-bold text-gray-800 mb-3 border-b border-gray-200 pb-1">Survival Rates</h3>
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-600">Newborn → Youth Survival: <span id="val-s1" class="font-bold text-amber-600">0.40</span></label>
                        <input type="range" id="slider-s1" min="0" max="1" step="0.05" value="0.4" class="w-full accent-amber-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Youth → Adult Survival: <span id="val-s2" class="font-bold text-amber-600">0.60</span></label>
                        <input type="range" id="slider-s2" min="0" max="1" step="0.05" value="0.6" class="w-full accent-amber-600" oninput="runSimulation()">
                        
                        <label class="block text-xs font-semibold text-gray-600">Adult Ongoing Survival: <span id="val-s3" class="font-bold text-amber-600">0.30</span></label>
                        <input type="range" id="slider-s3" min="0" max="1" step="0.05" value="0.3" class="w-full accent-amber-600" oninput="runSimulation()">
                    </div>
                </div>
            </div>

            <!-- Visualization Canvas -->
            <div class="md:col-span-2 flex flex-col justify-center">
                <div class="bg-white p-2 rounded-lg border border-gray-100">
                    <canvas id="growthChart" class="w-full h-96"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        function runSimulation() {
            // 1. Read current slider values
            const n0_init = parseFloat(document.getElementById('slider-n0').value);
            const n1_init = parseFloat(document.getElementById('slider-n1').value);
            const n2_init = parseFloat(document.getElementById('slider-n2').value);

            const f0 = parseFloat(document.getElementById('slider-f0').value);
            const f1 = parseFloat(document.getElementById('slider-f1').value);
            const f2 = parseFloat(document.getElementById('slider-f2').value);

            const s1 = parseFloat(document.getElementById('slider-s1').value);
            const s2 = parseFloat(document.getElementById('slider-s2').value);
            const s3 = parseFloat(document.getElementById('slider-s3').value);

            // 2. Update text labels above sliders to display numbers dynamically
            document.getElementById('val-n0').innerText = n0_init;
            document.getElementById('val-n1').innerText = n1_init;
            document.getElementById('val-n2').innerText = n2_init;
            document.getElementById('val-f0').innerText = f0.toFixed(1);
            document.getElementById('val-f1').innerText = f1.toFixed(1);
            document.getElementById('val-f2').innerText = f2.toFixed(1);
            document.getElementById('val-s1').innerText = s1.toFixed(2);
            document.getElementById('val-s2').innerText = s2.toFixed(2);
            document.getElementById('val-s3').innerText = s3.toFixed(2);

            // 3. Initialize simulation loops
            let n0 = n0_init;
            let n1 = n1_init;
            let n2 = n2_init;

            let populationHistory = [n0 + n1 + n2];
            let labels = ["Gen 0"];

            // Simulate 10 generations
            for (let g = 1; g <= 10; g++) {
                // Apply the interactive Leslie Matrix variables
                let next_n0 = (f0 * n0) + (f1 * n1) + (f2 * n2);
                let next_n1 = s1 * n0;
                let next_n2 = (s2 * n1) + (s3 * n2);

                n0 = next_n0;
                n1 = next_n1;
                n2 = next_n2;

                let total = n0 + n1 + n2;
                populationHistory.push(Math.round(total));
                labels.push("Gen " + g);
            }

            renderChart(labels, populationHistory);
        }

        function renderChart(labels, data) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Squirrel Population',
                        data: data,
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.05)',
                        fill: true,
                        tension: 0.2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true,
                            title: { display: true, text: 'Total Individuals' }
                        },
                        x: {
                            title: { display: true, text: 'Timeline Timeline' }
                        }
                    }
                }
            });
        }

        // Run simulation immediately on script load to draw initial graph
        runSimulation();
    </script>
</body>
</html>
